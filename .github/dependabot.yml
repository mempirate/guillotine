version: 2

updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/probes/power-monitor-probe"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Brussels"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Brussels"
    cooldown:
      default-days: 7
